<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a wiring diagram read left to right, from what sends data to where it rests.
   Node shape and tint carry the kind; the accent is reserved for the traced path. */
:root {
  --bg: #F3F5F8; --surface: #FFFFFF; --fg: #172033; --muted: #566175; --line: #BCC5D3; --accent: #2346D9;
  --entry-f: #E3E9FF; --entry-s: #2346D9;
  --service-f: #FFFFFF; --service-s: #7F8BA0;
  --store-f: #DDF1EC; --store-s: #0F7A64;
  --cron-f: #FBF0D9; --cron-s: #A36A00;
  --external-f: #EEEAF6; --external-s: #6A4FA3;
  --ai-f: #FCE4EC; --ai-s: #B0295E;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10151F; --surface: #1A2230; --fg: #E6EBF4; --muted: #A0ABBE; --line: #3F4B62; --accent: #93A9FF;
  --entry-f: #1F2A52; --entry-s: #93A9FF;
  --service-f: #1A2230; --service-s: #76839B;
  --store-f: #12352F; --store-s: #53C7AB;
  --cron-f: #392C12; --cron-s: #E3AE4E;
  --external-f: #2A2340; --external-s: #B39DE8;
  --ai-f: #3D1A2A; --ai-s: #F08BB0;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #10151F; --surface: #1A2230; --fg: #E6EBF4; --muted: #A0ABBE; --line: #3F4B62; --accent: #93A9FF;
  --entry-f: #1F2A52; --entry-s: #93A9FF;
  --service-f: #1A2230; --service-s: #76839B;
  --store-f: #12352F; --store-s: #53C7AB;
  --cron-f: #392C12; --cron-s: #E3AE4E;
  --external-f: #2A2340; --external-s: #B39DE8;
  --ai-f: #3D1A2A; --ai-s: #F08BB0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
.page {
  display: grid; gap: 20px; padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1760px; margin-inline: auto;
}
.page > * { min-width: 0; }
header { display: grid; gap: 6px; }
h1 { font: 600 clamp(30px, 4vw, 42px)/1.1 var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.tagline { margin: 0; color: var(--muted); font-size: 16px; max-width: 65ch; }
.facts { margin: 4px 0 0; font-size: 14px; max-width: 80ch; }
.facts .date { color: var(--muted); font-family: var(--mono); font-size: 12.5px; }
h2 { font: 600 13px/1.3 var(--body); text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 0; }
.flows { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; font-size: 14px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.map { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.map svg { display: block; width: 100%; min-width: 1240px; height: auto; }
.edge { fill: none; stroke: var(--line); stroke-width: 1.2; transition: opacity .15s; }
.edge.off { opacity: .45; }
.edge.on { stroke: var(--accent); stroke-width: 2; }
#arrow path { fill: var(--line); } #arrowOn path { fill: var(--accent); }
.node { cursor: pointer; transition: opacity .15s; }
.node.off { opacity: .42; }
.node:hover { opacity: 1; }
.node .box { stroke-width: 1.3; }
.node.sel .box { stroke-width: 3; }
.node .t { fill: var(--fg); font: 600 12.5px var(--body); text-anchor: middle; }
.node .s { fill: var(--muted); font: 400 10px var(--body); text-anchor: middle; }
.k-entry .box { fill: var(--entry-f); stroke: var(--entry-s); }
.k-service .box { fill: var(--service-f); stroke: var(--service-s); }
.k-store .box, .k-store .band { fill: var(--store-f); stroke: var(--store-s); }
.k-cron .box { fill: var(--cron-f); stroke: var(--cron-s); stroke-dasharray: 5 3; }
.k-external .box { fill: var(--external-f); stroke: var(--external-s); }
.k-agent .box, .k-model .box, .k-tool .box { fill: var(--ai-f); stroke: var(--ai-s); }
.lab rect { fill: var(--surface); stroke: var(--accent); stroke-width: .8; }
.lab text { fill: var(--fg); font: 500 10px var(--body); text-anchor: middle; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { display: inline-block; width: 22px; height: 13px; border: 1.3px solid; }
.detail { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 20px; }
.detail > * { min-width: 0; }
.detail h3 { font: 600 24px/1.2 var(--display); margin: 2px 0 6px; }
.detail p { margin: 0 0 8px; max-width: 65ch; }
.kind { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
code { font: 400 13px var(--mono); overflow-wrap: anywhere; }
.steps { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 2px; }
.step { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2px 14px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 6px 2px; font-size: 14px; }
.step b { font-weight: 500; }
.step span { color: var(--muted); font-size: 13px; }
.parts { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.parts ul { list-style: none; margin: 6px 0 0; padding: 0; }
.parts button { background: none; border: 0; padding: 2px 0; text-align: left; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; font-size: 14px; }
@media (max-width: 760px) { .detail { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { .edge, .node { transition: none; } }
</style>

<div class="page">
  <header>
    <h1 id="name"></h1>
    <p class="tagline" id="tagline"></p>
    <p class="facts" id="facts"></p>
  </header>
  <section aria-labelledby="flows-h" style="display:grid;gap:8px">
    <h2 id="flows-h">Trace a flow</h2>
    <div class="flows" id="flows"></div>
  </section>
  <figure style="margin:0;display:grid;gap:10px;min-width:0">
    <div class="map" id="map" tabindex="0" aria-label="Codebase map. Scroll sideways on small screens."></div>
    <figcaption class="legend" id="legend"></figcaption>
  </figure>
  <section class="detail" id="detail" aria-live="polite"></section>
  <section style="display:grid;gap:10px">
    <h2>Every part, by kind</h2>
    <div class="parts" id="parts"></div>
  </section>
</div>

<script id="data" type="application/json">__MAP_JSON__</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById("data").textContent);
  var G = D.graph, SVG = "http://www.w3.org/2000/svg";
  var byId = {}; G.nodes.forEach(function (n) { byId[n.id] = n; });
  var KIND = { entry: "Entry point", service: "Internal service", store: "Data store", cron: "Scheduled job", external: "Third party", agent: "AI agent", model: "AI model", tool: "AI tool" };
  var NW = 152, NH = 64, GAP = 84, PITCH = 82, PAD = 24;

  function el(tag, attrs, text) { var e = document.createElementNS(SVG, tag); for (var k in attrs || {}) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; }
  function h(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  // Word-wrap to at most `max` lines; long paths break after a slash.
  function wrap(s, width, max) {
    var tokens = [];
    (s || "").split(" ").forEach(function (w) {
      while (w.length > width) { var i = w.lastIndexOf("/", width - 1); i = i > 0 ? i + 1 : width; tokens.push(w.slice(0, i)); w = w.slice(i); }
      tokens.push(w);
    });
    var lines = [], cur = "";
    tokens.forEach(function (w) { var next = cur ? cur + " " + w : w; if (next.length > width && cur) { lines.push(cur); cur = w; } else cur = next; });
    if (cur) lines.push(cur);
    return lines.slice(0, max);
  }

  // Header
  var P = D.project, S = D.stats;
  document.getElementById("name").textContent = P.name + " codebase map";
  document.getElementById("tagline").textContent = P.tagline || "";
  var facts = document.getElementById("facts");
  var aiCount = (S.agents || 0) + (S.models || 0) + (S.tools || 0);
  facts.append((aiCount ? S.agents + " agents, " + S.models + " models and " + S.tools + " tools. " : "No AI runs here: 0 agents, 0 models, 0 tools. ") + S.integrations + " integrations: " + D.topIntegrations.map(function (i) { return i.label; }).join(", ") + ". " + (P.note ? P.note + " " : ""));
  facts.append(h("span", "date", "Scanned " + P.date));

  // Positions
  var cols = D.layout.columns.map(function (c) { return c.slice(); });
  var placed = {}; cols.forEach(function (c) { c.forEach(function (id) { placed[id] = 1; }); });
  G.nodes.forEach(function (n) { if (!placed[n.id]) cols[cols.length - 1].push(n.id); });
  var rows = Math.max.apply(null, cols.map(function (c) { return c.length; }));
  var W = cols.length * NW + (cols.length - 1) * GAP + PAD * 2 + 30, H = rows * PITCH - (PITCH - NH) + PAD * 2;
  var pos = {};
  cols.forEach(function (c, ci) {
    var top = PAD + (H - PAD * 2 - (c.length * PITCH - (PITCH - NH))) / 2;
    c.forEach(function (id, ri) { pos[id] = { x: PAD + ci * (NW + GAP), y: top + ri * PITCH, c: ci, r: ri }; });
  });

  var svg = el("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": P.name + " architecture: " + G.nodes.length + " parts joined by " + G.edges.length + " connections, read left to right." });
  var defs = el("defs");
  ["arrow", "arrowOn"].forEach(function (id) {
    var m = el("marker", { id: id, viewBox: "0 0 8 8", refX: 7, refY: 4, markerWidth: 7, markerHeight: 7, markerUnits: "userSpaceOnUse", orient: "auto" });
    m.append(el("path", { d: "M0 0 L8 4 L0 8 Z" })); defs.append(m);
  });
  svg.append(defs);
  var edgeLayer = el("g"), nodeLayer = el("g"), labelLayer = el("g");
  svg.append(edgeLayer, nodeLayer, labelLayer);

  // Edges: cubic curves. Returns control points so a label can sit on the curve.
  function geom(e) {
    var a = pos[e.from], b = pos[e.to], p;
    if (a.c === b.c && Math.abs(a.r - b.r) === 1) {
      var down = b.r > a.r, x = a.x + NW / 2;
      var y0 = down ? a.y + NH : a.y, y1 = down ? b.y : b.y + NH;
      p = [[x, y0], [x, y0], [x, y1], [x, y1]];
    } else if (a.c === b.c) {
      var rx = a.x + NW;
      p = [[rx, a.y + NH / 2], [rx + 34, a.y + NH / 2], [rx + 34, b.y + NH / 2], [rx, b.y + NH / 2]];
    } else {
      var fwd = b.c > a.c, sx = fwd ? a.x + NW : a.x, tx = fwd ? b.x : b.x + NW, bend = Math.max(36, Math.abs(tx - sx) * 0.42) * (fwd ? 1 : -1);
      p = [[sx, a.y + NH / 2], [sx + bend, a.y + NH / 2], [tx - bend, b.y + NH / 2], [tx, b.y + NH / 2]];
    }
    return p;
  }
  function at(p, t) {
    var u = 1 - t;
    return { x: u*u*u*p[0][0] + 3*u*u*t*p[1][0] + 3*u*t*t*p[2][0] + t*t*t*p[3][0], y: u*u*u*p[0][1] + 3*u*u*t*p[1][1] + 3*u*t*t*p[2][1] + t*t*t*p[3][1] };
  }
  G.edges.forEach(function (e) {
    var p = geom(e);
    e.p = p;
    e.path = el("path", { class: "edge", d: "M" + p[0] + " C" + p[1] + " " + p[2] + " " + p[3], "marker-end": "url(#arrow)" });
    edgeLayer.append(e.path);
  });

  // Nodes
  G.nodes.forEach(function (n) {
    var q = pos[n.id];
    var g = el("g", { class: "node k-" + n.kind, tabindex: 0, role: "button", "aria-label": n.label + ", " + (KIND[n.kind] || n.kind), transform: "translate(" + q.x + " " + q.y + ")" });
    var rx = n.kind === "entry" ? 20 : n.kind === "external" ? 2 : (n.kind === "agent" || n.kind === "model" || n.kind === "tool") ? 12 : 5;
    g.append(el("rect", { class: "box", width: NW, height: NH, rx: rx }));
    if (n.kind === "store") g.append(el("path", { class: "band", d: "M0 7 H" + NW, style: "fill:none" }));
    var tl = wrap(n.label, 21, 2), sl = wrap(n.sub, 27, 3 - tl.length);
    var total = tl.length * 15 + sl.length * 12.5, y = (NH - total) / 2 + 11;
    tl.forEach(function (t) { g.append(el("text", { class: "t", x: NW / 2, y: y }, t)); y += 15; });
    y += 0.5;
    sl.forEach(function (t) { g.append(el("text", { class: "s", x: NW / 2, y: y }, t)); y += 12.5; });
    n.g = g;
    g.addEventListener("click", function (ev) { ev.stopPropagation(); pickNode(n.id); });
    g.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); pickNode(n.id); } });
    nodeLayer.append(g);
  });
  var map = document.getElementById("map");
  map.append(svg);

  // Legend: only the kinds on this map
  var legend = document.getElementById("legend");
  Object.keys(KIND).forEach(function (k) {
    if (!G.nodes.some(function (n) { return n.kind === k; })) return;
    var s = h("span"), i = h("i"), key = (k === "agent" || k === "model" || k === "tool") ? "ai" : k;
    i.style.cssText = "background:var(--" + key + "-f);border-color:var(--" + key + "-s);border-radius:" + (k === "entry" ? "7px" : k === "external" ? "1px" : "3px") + (k === "cron" ? ";border-style:dashed" : "") + (k === "store" ? ";border-top-width:3px" : "");
    s.append(i, KIND[k]); legend.append(s);
  });

  // State: one flow or one node is highlighted at a time.
  function edgeKey(a, b) { return a + "\u0000" + b; }
  var edgeIndex = {}; G.edges.forEach(function (e) { edgeIndex[edgeKey(e.from, e.to)] = e; });
  var flows = (D.flows || []).map(function (f) { return { id: f.id, label: f.label, summary: f.summary, edges: f.edges.map(function (x) { return edgeIndex[edgeKey(x[0], x[1])]; }) }; });
  var chips = document.getElementById("flows"), chipFor = {};
  flows.forEach(function (f) {
    var b = h("button", "chip", f.label); b.type = "button"; b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", function () { pickFlow(f.id); });
    chipFor[f.id] = b; chips.append(b);
  });
  var allChip = h("button", "chip", "Everything"); allChip.type = "button"; allChip.setAttribute("aria-pressed", "false");
  allChip.addEventListener("click", function () { pickFlow(null); });
  chips.append(allChip);

  function paint(active, selected) {
    var on = active ? new Set(active) : null, nodesOn = null;
    if (on) { nodesOn = new Set(); active.forEach(function (e) { nodesOn.add(e.from); nodesOn.add(e.to); }); if (selected) nodesOn.add(selected); }
    G.edges.forEach(function (e) {
      var hit = on && on.has(e);
      e.path.setAttribute("class", "edge" + (hit ? " on" : on ? " off" : ""));
      e.path.setAttribute("marker-end", hit ? "url(#arrowOn)" : "url(#arrow)");
      if (hit) edgeLayer.append(e.path);
    });
    G.nodes.forEach(function (n) {
      var c = "node k-" + n.kind + (nodesOn && !nodesOn.has(n.id) ? " off" : "") + (selected === n.id ? " sel" : "");
      n.g.setAttribute("class", c);
    });
    drawLabels(active || []);
  }

  // Labels sit in the gap beside the target, and shift down to avoid each other.
  function drawLabels(edges) {
    labelLayer.textContent = "";
    var taken = [];
    edges.forEach(function (e) {
      var text = e.label || e.kind; if (!text) return;
      var lines = wrap(text, 15, 2), w = 8 + 5.4 * Math.max.apply(null, lines.map(function (l) { return l.length; })), lh = lines.length * 12 + 5;
      var a = pos[e.from], b = pos[e.to], t = 0.5;
      if (a.c !== b.c) {
        // Find where the curve crosses the middle of the gap next to the target.
        var goal = b.c > a.c ? b.x - GAP / 2 : b.x + NW + GAP / 2, best = Infinity;
        for (var s = 0; s <= 100; s++) { var d = Math.abs(at(e.p, s / 100).x - goal); if (d < best) { best = d; t = s / 100; } }
      }
      var m = at(e.p, t), x = m.x, y = m.y - lh / 2;
      if (a.c === b.c && Math.abs(a.r - b.r) === 1) x += w / 2 - 12;
      else if (a.c === b.c) x += 26;
      for (var i = 0; i < 40; i++) {
        var hit = taken.some(function (r) { return x - w/2 < r.x + r.w/2 + 2 && x + w/2 > r.x - r.w/2 - 2 && y < r.y + r.h + 2 && y + lh > r.y - 2; });
        if (!hit) break;
        y += 7;
      }
      taken.push({ x: x, y: y, w: w, h: lh });
      var g = el("g", { class: "lab" });
      g.append(el("rect", { x: x - w/2, y: y, width: w, height: lh, rx: 3 }));
      lines.forEach(function (l, k) { g.append(el("text", { x: x, y: y + 11.5 + k * 12 }, l)); });
      labelLayer.append(g);
    });
  }

  var detail = document.getElementById("detail");
  function stepButton(e, go) {
    var li = h("li"), b = h("button", "step"); b.type = "button";
    b.append(h("b", null, byId[e.from].label + " → " + byId[e.to].label), h("span", null, [e.kind, e.label].filter(Boolean).join(": ")));
    b.addEventListener("click", function () { pickNode(go); });
    li.append(b); return li;
  }
  function setChips(id) {
    flows.forEach(function (f) { chipFor[f.id].setAttribute("aria-pressed", f.id === id ? "true" : "false"); });
    allChip.setAttribute("aria-pressed", id === null ? "true" : "false");
  }
  function pickFlow(id) {
    setChips(id);
    detail.textContent = "";
    var left = h("div"), right = h("div");
    if (id === null) {
      paint(null, null);
      left.append(h("div", "kind", "Whole map"), h("h3", null, "Everything"), h("p", null, G.nodes.length + " parts and " + G.edges.length + " connections. Select a part to see what it talks to."));
      detail.append(left); return;
    }
    var f = flows.filter(function (x) { return x.id === id; })[0];
    paint(f.edges, null);
    left.append(h("div", "kind", "Flow"), h("h3", null, f.label), h("p", null, f.summary));
    var ol = h("ol", "steps"); f.edges.forEach(function (e) { ol.append(stepButton(e, e.to)); });
    right.append(h("h2", null, "Steps"), ol);
    detail.append(left, right);
  }
  function pickNode(id) {
    setChips(undefined);
    var n = byId[id], touching = G.edges.filter(function (e) { return e.from === id || e.to === id; });
    paint(touching, id);
    detail.textContent = "";
    var left = h("div"), right = h("div");
    left.append(h("div", "kind", KIND[n.kind] || n.kind), h("h3", null, n.label));
    if (n.detail || n.sub) left.append(h("p", null, n.detail || n.sub));
    if (n.sub && n.detail) left.append(h("p", null, n.sub));
    if (n.sourceRef) { var c = h("p"); c.append(h("code", null, n.sourceRef)); left.append(c); }
    var ol = h("ol", "steps"); touching.forEach(function (e) { ol.append(stepButton(e, e.from === id ? e.to : e.from)); });
    right.append(h("h2", null, touching.length + " connections"), ol);
    detail.append(left, right);
  }

  // Index of every part, for reading without the drawing (and on phones).
  var parts = document.getElementById("parts");
  Object.keys(KIND).forEach(function (k) {
    var list = G.nodes.filter(function (n) { return n.kind === k; }); if (!list.length) return;
    var box = h("div"), ul = h("ul"); box.append(h("h2", null, KIND[k]));
    list.forEach(function (n) { var li = h("li"), b = h("button", null, n.label); b.type = "button"; b.addEventListener("click", function () { pickNode(n.id); map.scrollIntoView({ block: "nearest" }); }); li.append(b); ul.append(li); });
    box.append(ul); parts.append(box);
  });

  pickFlow(flows.length ? flows[0].id : null);
})();
</script>
