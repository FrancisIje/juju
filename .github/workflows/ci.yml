name: CI

# Pull requests run the checks here. Pushes to main don't trigger this file
# directly: deploy.yml calls it (workflow_call) before deploying, so each
# merge runs the checks once, and a failure stops the deploy.
on:
  pull_request:
  workflow_call:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fails if someone edited a page in docs/_src/ but forgot `make docs`,
      # so the published pages always match their sources. `git status` also
      # catches a generated page that was never committed, which `git diff`
      # would miss.
      - name: generated docs are up to date
        run: |
          ./scripts/build-docs.sh
          test -z "$(git status --porcelain docs/)" || (git status --porcelain docs/ && exit 1)

  sdks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdks/package-lock.json
      # npm ci installs exactly what package-lock.json says, so CI tests the
      # same versions you tested locally.
      - run: npm ci
      - run: npm run check

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./... && go vet -tags=integration ./...
      - name: Unit tests
        run: go test -race -count=1 ./...
      # Known vulnerabilities in Go itself or a dependency, that the code can
      # actually reach. A new one fails CI, and so blocks deploys, until the
      # Go version (go.mod) or the module is updated.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      # Integration tests start their own embedded Postgres, exactly like on a
      # laptop, so CI and local runs can't drift apart.
      - name: Cache embedded Postgres
        uses: actions/cache@v4
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-v17-${{ runner.os }}
      # ClickHouse for the analytics tests: the same pinned build, from the
      # same script, as `make devch` on a laptop (checked against its
      # published SHA-512). One instance serves every test package; each
      # test uses a database of its own.
      - name: Cache ClickHouse
        uses: actions/cache@v4
        with:
          path: ~/.cache/juju
          key: clickhouse-${{ hashFiles('scripts/devch.sh') }}-${{ runner.os }}
      - name: Start ClickHouse
        run: |
          (../scripts/devch.sh /tmp/juju-ch > /tmp/clickhouse.log 2>&1 &)
          timeout 300 sh -c 'until curl -sf http://127.0.0.1:8123/ping; do sleep 1; done'
      - name: Integration tests
        env:
          JUJU_TEST_CLICKHOUSE_URL: http://127.0.0.1:8123
        run: go test -race -count=1 -tags=integration ./...
      - name: Fuzz the event parser
        run: go test ./internal/event -run='^$' -fuzz=FuzzNormalize -fuzztime=20s
      # go test fuzzes one target per run, so the PII scrubber gets its own.
      - name: Fuzz the PII scrubber
        run: go test ./internal/event -run='^$' -fuzz=FuzzScrub -fuzztime=20s
      - name: Fuzz the debug id injector
        run: go test ./internal/debugid -run='^$' -fuzz=FuzzInject -fuzztime=20s

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      # tsc (which also type-checks the tests), vitest, then the production build.
      - run: npm run check

  # The whole product in a real browser: Chrome → embedded dashboard → Go
  # server → Postgres → alerts to a fake Slack. Catches breaks between the UI
  # and the API that unit tests on either side can't see.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Cache embedded Postgres
        uses: actions/cache@v4
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-v17-${{ runner.os }}
      - name: Build the dashboard into the server
        run: make dashboard && (cd server && go build -o juju ./cmd/juju)
      - name: Cache ClickHouse
        uses: actions/cache@v4
        with:
          path: ~/.cache/juju
          key: clickhouse-${{ hashFiles('scripts/devch.sh') }}-${{ runner.os }}
      - name: Start Postgres, ClickHouse, the server and a fake Slack
        run: |
          (scripts/devch.sh /tmp/juju-ch > /tmp/clickhouse.log 2>&1 &)
          timeout 300 sh -c 'until curl -sf http://127.0.0.1:8123/ping; do sleep 1; done' 
          (cd server && go run ./cmd/devdb -dir /tmp/juju-db > /tmp/devdb.log 2>&1 &)
          timeout 120 sh -c 'until grep -q "postgres ready" /tmp/devdb.log; do sleep 1; done'
          python3 dashboard/e2e/fake-slack.py &
          (cd server && JUJU_ALLOW_HTTP_WEBHOOKS=true JUJU_DATA_DIR=/tmp/juju-data JUJU_CLICKHOUSE_URL=http://127.0.0.1:8123 ./juju serve > /tmp/juju.log 2>&1 &)
          timeout 30 sh -c 'until curl -sf localhost:8080/healthz; do sleep 1; done'
      - name: Playwright
        working-directory: dashboard
        run: JUJU_E2E_SLACK=http://127.0.0.1:9911/hook JUJU_E2E_ANALYTICS=1 npm run e2e
      - name: Server log
        if: failure()
        run: cat /tmp/juju.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: dashboard/test-results/
